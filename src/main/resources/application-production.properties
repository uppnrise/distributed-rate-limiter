# Production-specific configuration
#
# Activated via SPRING_PROFILES_ACTIVE=production (see k8s/base/configmap.yaml
# and k8s/environments/prod). Values here override application.properties.

# Explicitly disable the SpringDoc/OpenAPI documentation endpoints in
# production. Public API documentation exposure must be an intentional,
# separate decision, not the SpringDoc default.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
