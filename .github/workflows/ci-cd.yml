name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      run_static_analysis:
        description: 'Run static analysis (PMD, SpotBugs, Checkstyle)'
        required: false
        default: 'false'
        type: boolean
      run_security_scan:
        description: 'Run security vulnerability scanning'
        required: false
        default: 'false'
        type: boolean
      run_load_test:
        description: 'Run load and performance testing'
        required: false
        default: 'false'
        type: boolean
      build_and_push:
        description: 'Build and push Docker image'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  test:
    name: Test & Code Coverage
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Maven dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: examples/web-dashboard/package-lock.json
        
    - name: Run tests with coverage
      run: ./mvnw clean verify

    - name: Install dashboard dependencies
      working-directory: examples/web-dashboard
      run: npm ci --ignore-scripts

    - name: Audit dashboard dependencies
      working-directory: examples/web-dashboard
      run: npm audit --audit-level=low

    - name: Lint dashboard
      working-directory: examples/web-dashboard
      run: npm run lint

    - name: Build dashboard
      working-directory: examples/web-dashboard
      run: npm run build
      
    - name: Generate coverage report
      run: ./mvnw jacoco:report
      
    - name: Check coverage threshold
      run: ./mvnw jacoco:check

    - name: Upload coverage results to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./target/site/jacoco/jacoco.xml
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Archive test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/failsafe-reports/
          target/site/jacoco/

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.run_static_analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Maven dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run SpotBugs analysis
      run: ./mvnw clean compile spotbugs:check
      
    - name: Run PMD analysis
      run: ./mvnw pmd:check
      
    - name: Run Checkstyle
      run: ./mvnw checkstyle:check
      continue-on-error: true
      
    - name: Upload SpotBugs results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: spotbugs-results
        path: target/spotbugsXml.xml

  security-scan:
    name: Snyk Security Scanning
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_security_scan)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: examples/web-dashboard/package-lock.json
        
    - name: Cache Maven dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Install Snyk CLI
      run: npm install --global snyk@1.1306.1

    - name: Verify Snyk authentication
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        if [ -z "$SNYK_TOKEN" ]; then
          echo "::error::SNYK_TOKEN is required for dependency vulnerability scanning"
          exit 1
        fi

    - name: Prepare security reports
      run: mkdir -p target/security-reports

    - name: Scan Maven dependencies with Snyk
      id: snyk-maven
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: >-
        snyk test
        --file=pom.xml
        --package-manager=maven
        --severity-threshold=low
        --json-file-output=target/security-reports/snyk-maven.json
        --sarif-file-output=target/security-reports/snyk-maven.sarif

    - name: Install dashboard dependencies
      working-directory: examples/web-dashboard
      run: npm ci --ignore-scripts

    - name: Scan dashboard dependencies with Snyk
      id: snyk-dashboard
      continue-on-error: true
      working-directory: examples/web-dashboard
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: >-
        snyk test
        --file=package.json
        --package-manager=npm
        --severity-threshold=low
        --json-file-output=../../target/security-reports/snyk-dashboard.json
        --sarif-file-output=../../target/security-reports/snyk-dashboard.sarif
      
    - name: Run OWASP dependency vulnerability scan
      if: github.event_name == 'workflow_dispatch' && inputs.run_security_scan
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: ./mvnw org.owasp:dependency-check-maven:check
      
    - name: Upload security scan results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: security-scan-results
        path: |
          target/security-reports/
          target/dependency-check-report.html
        if-no-files-found: warn

    - name: Enforce Snyk security gate
      if: always()
      run: |
        if [[ "${{ steps.snyk-maven.outcome }}" != "success" ]]; then
          echo "::error::Snyk found Maven vulnerabilities, or the Maven scan failed"
          exit 1
        fi
        if [[ "${{ steps.snyk-dashboard.outcome }}" != "success" ]]; then
          echo "::error::Snyk found dashboard vulnerabilities, or the npm scan failed"
          exit 1
        fi

  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.run_load_test
    
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Maven dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Start application for load testing
      run: |
        ./mvnw clean package -DskipTests
        java -jar target/distributed-rate-limiter-*.jar &
        echo $! > app.pid
        sleep 30  # Wait for application to start
      env:
        SPRING_PROFILES_ACTIVE: test
        
    - name: Wait for application readiness
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8080/actuator/health; do sleep 2; done'
        
    - name: Run basic load test
      run: |
        ./mvnw gatling:test -Dgatling.simulationClass=dev.bnacar.distributedratelimiter.loadtest.BasicLoadTest
      env:
        LOAD_TEST_BASE_URL: http://localhost:8080
        LOAD_TEST_DURATION: 30
        LOAD_TEST_MAX_USERS: 25
        LOAD_TEST_RESPONSE_TIME_THRESHOLD: 1000
        LOAD_TEST_SUCCESS_RATE_THRESHOLD: 90.0
        
    - name: Run stress test (on main branch only)
      if: github.ref == 'refs/heads/main'
      run: |
        ./mvnw gatling:test -Dgatling.simulationClass=dev.bnacar.distributedratelimiter.loadtest.StressTest
      env:
        STRESS_TEST_BASE_URL: http://localhost:8080
        STRESS_TEST_DURATION: 60
        STRESS_TEST_MAX_USERS: 50
        
    - name: Store performance baseline
      run: |
        curl -X POST http://localhost:8080/api/performance/baseline \
          -H "Content-Type: application/json" \
          -d '{
            "testName": "CI-BasicLoadTest",
            "averageResponseTime": 100.0,
            "maxResponseTime": 500.0,
            "throughputPerSecond": 500.0,
            "successRate": 95.0,
            "commitHash": "${{ github.sha }}",
            "buildNumber": "${{ github.run_number }}",
            "environment": "CI"
          }'
      continue-on-error: true
        
    - name: Stop application
      run: |
        if [ -f app.pid ]; then
          kill $(cat app.pid) || true
          rm app.pid
        fi
        
    - name: Upload load test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: load-test-results
        path: |
          target/gatling/
          target/performance-baselines.json
          
    - name: Upload Gatling reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: gatling-reports
        path: target/gatling/*/

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_and_push) ||
      (github.event_name == 'push' && github.ref_type == 'tag')
    
    permissions:
      contents: read
      packages: write
      security-events: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      
    - name: Log in to Container Registry
      uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        scanners: 'vuln'
        severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, static-analysis, security-scan, load-test]
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.run_static_analysis || inputs.run_security_scan || inputs.run_load_test)
    
    steps:
    - name: Check quality gate status
      run: |
        if [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "❌ Tests failed"
          exit 1
        fi
        if [[ "${{ needs.static-analysis.result }}" != "success" && "${{ needs.static-analysis.result }}" != "skipped" ]]; then
          echo "❌ Static analysis failed"
          exit 1
        fi
        if [[ "${{ needs.security-scan.result }}" != "success" && "${{ needs.security-scan.result }}" != "skipped" ]]; then
          echo "❌ Security scan failed"
          exit 1
        fi
        if [[ "${{ needs.load-test.result }}" != "success" && "${{ needs.load-test.result }}" != "skipped" ]]; then
          echo "❌ Load testing failed"
          exit 1
        fi
        echo "✅ All quality gates passed"
