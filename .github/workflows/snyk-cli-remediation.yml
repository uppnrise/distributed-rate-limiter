name: Snyk CLI Remediation Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan-maven:
    name: Scan Maven project
    uses: uppnrise/snyk-auto-remediate/.github/workflows/snyk-remediate.reusable.yml@master
    with:
      target-repository: uppnrise/distributed-rate-limiter
      target-branches: main
      engine-ref: master
      working-directory: .
      package-managers: maven
      severity-threshold: high
      dry-run: true
      enable-copilot-agent-fallback: false
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  scan-dashboard:
    name: Scan npm dashboard
    uses: uppnrise/snyk-auto-remediate/.github/workflows/snyk-remediate.reusable.yml@master
    with:
      target-repository: uppnrise/distributed-rate-limiter
      target-branches: main
      engine-ref: master
      working-directory: examples/web-dashboard
      package-managers: npm
      severity-threshold: high
      dry-run: true
      enable-copilot-agent-fallback: false
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
